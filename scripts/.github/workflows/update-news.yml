name: Update AI News & Articles

on:
  schedule:
    # كل يوم الساعة 6 صباحاً بتوقيت UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run news fetcher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_news.py

      - name: Commit & push changes
        run: |
          git config user.name "AI Revolution Bot"
          git config user.email "bot@airevolution.com"
          git add articles/ articles.json sitemap.xml
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Auto-update: new AI articles $(date +'%Y-%m-%d')"
          git push
